<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc">
  <title id="title">FastapiAdmin 后端分层架构</title>
  <desc id="desc">Vue 管理页面依次调用 Controller、Service、CRUD 和 MySQL；Controller 通过依赖注入使用登录权限与数据库会话，并访问 Redis。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .node { stroke: #2563eb; stroke-width: 2; fill: #eff6ff; }
      .dependency { stroke: #7c3aed; stroke-width: 2; fill: #f5f3ff; }
      .storage { stroke: #059669; stroke-width: 2; fill: #ecfdf5; }
    </style>
  </defs>

  <rect width="1160" height="310" rx="12" fill="#ffffff"/>

  <path class="edge" d="M 205 90 H 245"/>
  <path class="edge" d="M 415 90 H 455"/>
  <path class="edge" d="M 625 90 H 665"/>
  <path class="edge" d="M 835 90 H 875"/>
  <path class="edge" stroke-dasharray="7 6" d="M 330 120 V 190"/>
  <path class="edge" d="M 555 230 H 680"/>

  <rect class="node" x="25" y="60" width="180" height="60" rx="10"/>
  <text class="label" x="115" y="90">Vue 管理页面</text>

  <rect class="node" x="245" y="60" width="170" height="60" rx="10"/>
  <text class="label" x="330" y="90">Controller 接口</text>

  <rect class="node" x="455" y="60" width="170" height="60" rx="10"/>
  <text class="label" x="540" y="90">Service 业务处理</text>

  <rect class="node" x="665" y="60" width="170" height="60" rx="10"/>
  <text class="label" x="750" y="90">CRUD 数据访问</text>

  <rect class="storage" x="875" y="60" width="150" height="60" rx="30"/>
  <text class="label" x="950" y="90">MySQL</text>

  <text class="edge-label" x="380" y="158">依赖注入</text>
  <rect class="dependency" x="210" y="190" width="345" height="80" rx="10"/>
  <text class="label" x="382.5" y="230">登录权限与数据库会话</text>

  <rect class="storage" x="680" y="200" width="215" height="60" rx="30"/>
  <text class="label" x="787.5" y="230">Redis 会话等数据</text>
</svg>
