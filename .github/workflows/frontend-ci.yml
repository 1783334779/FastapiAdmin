name: frontend

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: false
      skip-web:
        type: boolean
        default: false
      skip-app:
        type: boolean
        default: false
  push:
    branches-ignore: [master]
    paths:
      - "frontend/**"
      - "design/**"
      - "scripts/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "design/**"
      - "scripts/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  brand:
    name: 三端品牌一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Logo / 颜色 / 间距检查
        run: node scripts/check-brand-consistency.mjs

  web:
    if: ${{ !inputs.skip-web }}
    name: web（类型检查 + 单元测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    env:
      VITE_BASE_URL: /web/
      VITE_APP_BASE_API: /api/v1
      VITE_APP_WS_ENDPOINT: wss://${{ vars.DEPLOY_HOST }}/api/v1/ai/chat/ws
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # src/types/{auto-imports,components}.d.ts 由 unplugin-* 在 vite 运行时生成，
      # 仓库按惯例不跟踪（见 frontend/web/.gitignore）。干净检出下 vue-tsc 会因缺少
      # 自动导入声明报大量 TS2304（ref/h/onMounted/ElMessage…），因此必须先跑一次构建
      # 生成这些声明，再执行类型检查。顺带把生产构建纳入 CI 校验。
      - name: 生产构建（生成自动导入声明）
        run: pnpm run build:prod

      - name: 类型检查
        run: pnpm run type-check

      - name: 单元测试
        run: pnpm run test

      - name: 保存已通过检查的前端成品
        if: inputs.upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: frontend/web/dist/
          if-no-files-found: error
          retention-days: 1

  app:
    if: ${{ !inputs.skip-app }}
    name: app（类型检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run type-check
